<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Website</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
    /* Simple animation */
    .fade-in {
        animation: fadeIn 2s ease-in-out;
    }
    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }
</style>

</head>

<body id="body" class="bg-white text-black transition duration-500">

<!-- 🌙 Navbar -->
<nav class="flex justify-between items-center p-5 shadow-md">
    <h1 class="text-2xl font-bold text-indigo-600">MySite</h1>

    <div class="space-x-4">
        <a href="#" class="hover:text-indigo-600">Home</a>
        <a href="#" class="hover:text-indigo-600">About</a>
        <a href="#" class="hover:text-indigo-600">Contact</a>
    </div>

    <button onclick="toggleDarkMode()" class="bg-indigo-600 text-white px-4 py-1 rounded">
        🌙
    </button>
</nav>

<!-- 🌟 Hero Section -->
<section class="h-screen flex flex-col md:flex-row items-center justify-center px-10">

    <!-- Text -->
    <div class="md:w-1/2 text-center md:text-left fade-in">
        <h1 class="text-5xl font-bold mb-4">
            Build Amazing Websites 🚀
        </h1>
        <p class="mb-6 text-gray-600">
            Learn HTML, CSS, and JavaScript easily and create modern UI designs.
        </p>

        <button class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">
            Get Started
        </button>
    </div>

    <!-- Image -->
    <div class="md:w-1/2 mt-10 md:mt-0 fade-in">
        <img src="https://cdn-icons-png.flaticon.com/512/1055/1055687.png" 
             class="w-80 mx-auto">
    </div>

</section>

<!-- 📦 About Section -->

<section class="text-center p-10 bg-gray-100">
    <h2 class="text-3xl font-bold mb-4">About This Website</h2>
    <p>This is a fully responsive modern website with dark mode and animations.</p>
</section>

<!-- 📞 Contact Section -->
<section class="text-center p-10">
    <h2 class="text-3xl font-bold mb-4">Contact Us</h2>
    <input type="text" placeholder="Enter your name" class="border p-2 m-2"><br>
    <button class="bg-indigo-600 text-white px-6 py-2 rounded">
        Submit
    </button>
</section>

<!-- ⚙️ JavaScript -->
<script>
function toggleDarkMode() {
    const body = document.getElementById("body");

    if (body.classList.contains("bg-white")) {
        body.classList.remove("bg-white", "text-black");
        body.classList.add("bg-gray-900", "text-white");
    } else {
        body.classList.remove("bg-gray-900", "text-white");
        body.classList.add("bg-white", "text-black");
    }
}
</script>

</body>
</html>
