<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hero Section</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <!-- Hero Section -->
    <section class="h-screen flex items-center justify-center bg-gradient-to-r from-indigo-500 to-purple-600 text-white">
        
        <div class="text-center px-4">
            <h1 class="text-5xl font-bold mb-4">Welcome to My Website 🚀</h1>
            <p class="text-lg mb-6">Build modern websites easily with simple code</p>
            
            <div class="flex justify-center gap-4">
                <button class="bg-white text-indigo-600 px-6 py-2 rounded-lg font-semibold hover:bg-gray-200">
                    Get Started
                </button>
                <button class="border border-white px-6 py-2 rounded-lg hover:bg-white hover:text-indigo-600">
                    Learn More
                </button>
            </div>
        </div>

    </section>

</body>
</html>
